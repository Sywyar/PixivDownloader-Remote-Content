name: Renew announcement index

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: announcement-renewal
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository_id == '1331206266' && github.repository_owner_id == '83223374' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.expiry.outputs.due }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python scripts/validate_content.py
      - id: expiry
        run: python scripts/renew_announcements.py --github-output "$GITHUB_OUTPUT"

  renew:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: announcement-signing
    permissions:
      contents: write
    steps:
      - name: Check out the checked commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: remote-content
      - name: Check out signature tool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sywyar/PixivDownloader
          ref: 6a71b5120f8f0d05e64a98ec8341cfe1941d3e7e
          persist-credentials: false
          path: signature-source
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build signature tool
        run: mvn -B -ntp -f signature-source/pom.xml -pl pixivdownload-plugin-signature -am package -DskipTests -Dexec.skip=true
      - name: Test and validate the original signed content
        working-directory: remote-content
        env:
          SIGNATURE_TOOL_JAR: ${{ github.workspace }}/signature-source/pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-1.0.0.jar
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/validate_content.py
          java -cp "$SIGNATURE_TOOL_JAR" top.sywyar.pixivdownload.plugin.signature.cli.PluginSignatureTool verify-manifest --manifest announcements/index.json --signature announcements/index.json.sig --repository-id pixivdownloader-remote-announcements
      - name: Renew and sign the index
        working-directory: remote-content
        env:
          PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64" ]; then
            echo '::error::Configure PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64 in the announcement-signing environment.'
            exit 1
          fi
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/announcement-key.XXXXXX")"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "$PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64" | base64 --decode > "$key_file"
          unset PLUGIN_SIGNING_PRIVATE_KEY_PEM_BASE64
          python scripts/renew_announcements.py --write
          java -cp ../signature-source/pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-1.0.0.jar top.sywyar.pixivdownload.plugin.signature.cli.PluginSignatureTool manifest --manifest announcements/index.json --repository-id pixivdownloader-remote-announcements --key-id pixivdownloader-official-root-2026-07 --private-key "$key_file" --out announcements/index.json.sig
      - name: Verify renewed content
        working-directory: remote-content
        run: |
          python scripts/validate_content.py --base-ref HEAD
          java -cp ../signature-source/pixivdownload-plugin-signature/target/pixivdownload-plugin-signature-1.0.0.jar top.sywyar.pixivdownload.plugin.signature.cli.PluginSignatureTool verify-manifest --manifest announcements/index.json --signature announcements/index.json.sig --repository-id pixivdownloader-remote-announcements
          git diff --check
      - name: Publish one atomic index and signature commit
        working-directory: remote-content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- announcements/index.json announcements/index.json.sig
          git -c core.quotePath=false diff --cached --name-only > "$RUNNER_TEMP/renewed-files"
          printf '%s\n' announcements/index.json announcements/index.json.sig > "$RUNNER_TEMP/expected-files"
          diff "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/renewed-files"
          printf '%s\n' 'chore(announcements): 自动续签公告索引' > "$RUNNER_TEMP/renewal-message"
          git commit -F "$RUNNER_TEMP/renewal-message"
          git push origin HEAD:refs/heads/master

  publish:
    needs: [check, renew]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.renew.result == 'success' || needs.renew.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Publish the current master to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='repos/Sywyar/PixivDownloader-Remote-Content'
          expected="$(gh api "$repo/git/ref/heads/master" --jq .object.sha)"
          build="$(gh api "$repo/pages/builds/latest")"
          if [ "$(jq -r .commit <<< "$build")" != "$expected" ] || [ "$(jq -r .status <<< "$build")" = 'errored' ]; then
            gh api --method POST "$repo/pages/builds"
          fi
          for attempt in {1..60}; do
            build="$(gh api "$repo/pages/builds/latest")"
            if [ "$(jq -r .commit <<< "$build")" = "$expected" ]; then
              case "$(jq -r .status <<< "$build")" in
                built) echo "Pages published commit $expected." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
                errored) echo '::error::Pages build failed.'; exit 1 ;;
              esac
            fi
            test "$(gh api "$repo/git/ref/heads/master" --jq .object.sha)" = "$expected"
            sleep 10
          done
          echo '::error::Pages publication was not confirmed after sixty checks.'
          exit 1
