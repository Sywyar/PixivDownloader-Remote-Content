name: Content validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate content
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/validate_content.py
      - name: Protect published content in pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/validate_content.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Protect published content on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/validate_content.py --base-ref "${{ github.event.before }}"
